<title id="title">AIMakeAll 知识覆盖图 V5</title><desc id="description">十八个既有知识领域。新增 ARITH 算术电路与 RAS 数据完整性两组，各六项待实现实验，累计十组六十项。底部列出阶段安排与四项共同交付。覆盖不代表完成，不要求实板或流片。</desc>
