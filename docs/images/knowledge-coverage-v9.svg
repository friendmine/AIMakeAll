<rect x="819" y="613" width="246" height="119" rx="8" fill="#dceee8"/>
<text x="832" y="648" font-size="23" font-weight="700" fill="#086a68">合并与还原</text>
<text x="832" y="686" font-size="17" font-weight="400" fill="#172b3a">跨段求和、加一次偏置</text>
<text x="832" y="713" font-size="17" font-weight="400" fill="#172b3a">复核全部 35 项输出</text>
