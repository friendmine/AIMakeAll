<text x="210" y="885" font-size="20" font-weight="400" fill="#172b3a">同一层的前向、反向、一次参数更新及张量账本</text>
<text x="52" y="927" font-size="20" font-weight="650" fill="#086a68">信息与编码</text>
<text x="210" y="927" font-size="20" font-weight="400" fill="#172b3a">无损前缀码、有损量化、信道冗余与失真</text>
<text x="52" y="969" font-size="20" font-weight="650" fill="#086a68">物理互连</text>
<text x="210" y="969" font-size="20" font-weight="400" fill="#172b3a">改变阻抗、采样相位与衰减，观察眼图开口</text>
<text x="52" y="1011" font-size="20" font-weight="650" fill="#086a68">人机协作</text>
<text x="210" y="1011" font-size="20" font-weight="400" fill="#172b3a">复核助手引用、纠正预算、确认或接管终止</text>
<rect x="48" y="1056" width="1024" height="221" rx="8" fill="#f4ebd9"/>
<text x="69" y="1095" font-size="25" font-weight="700" fill="#86531a">实验 02　训练小模型，把前馈投影接入 4×4 阵列</text>
<text x="69" y="1132" font-size="19" font-weight="400" fill="#172b3a">模型研发　同一复制任务，宽度 32 / 24 从零训练；量化后测试困惑度 2.2080 / 2.2194</text>
<text x="69" y="1168" font-size="17" font-weight="400" fill="#172b3a">电路设计　16 个 MAC、256 B 局部存储；分库并行读使宽度 32 的提示词投影从 1216 降至 960 拍</text>
<text x="69" y="1203" font-size="18" font-weight="400" fill="#172b3a">推理部署　RTL 返回整数，CPU 继续运行模型；每种组合的 5632 个输出分数与量化参考相符</text>
<text x="69" y="1243" font-size="18" font-weight="400" fill="#86531a">下一阶段　RV32 驱动同一阵列 → 自然语言模型与完整推理 → 个人迁移验收</text></g></svg>
