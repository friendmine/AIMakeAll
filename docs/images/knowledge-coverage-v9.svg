<text x="318" y="713" font-size="17" font-weight="400" fill="#172b3a">逐项比对部分和</text>
<rect x="562" y="613" width="246" height="119" rx="8" fill="#dceee8"/>
<text x="575" y="648" font-size="23" font-weight="700" fill="#086a68">设备与电路对照</text>
