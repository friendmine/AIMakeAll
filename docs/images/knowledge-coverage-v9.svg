<text x="176" y="775" font-size="20" font-weight="400" fill="#172b3a">3212 B → 1606 B　｜　256 + 1 → 122 + 122 + 13　｜　整数结果一致</text>
<text x="48" y="841" font-size="28" font-weight="700" fill="#172b3a">用四个小实验连接原理与应用</text>
