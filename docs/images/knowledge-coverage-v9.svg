<rect x="48" y="613" width="246" height="119" rx="8" fill="#dceee8"/>
<text x="61" y="648" font-size="23" font-weight="700" fill="#086a68">量化和布局</text>
<text x="61" y="686" font-size="17" font-weight="400" fill="#172b3a">独立参考读取 W[N,K]</text>
<text x="61" y="713" font-size="17" font-weight="400" fill="#172b3a">设备打包为 B[K,N]</text>
<rect x="305" y="613" width="246" height="119" rx="8" fill="#dceee8"/>
<text x="318" y="648" font-size="23" font-weight="700" fill="#086a68">按命令分块</text>
